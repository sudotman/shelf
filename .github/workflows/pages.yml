name: Publish shelf

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out books and history
        uses: actions/checkout@v4
        with:
          # Full history gives each book its "added" date from its first commit.
          fetch-depth: 0
          lfs: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore extracted metadata
        uses: actions/cache@v4
        with:
          path: .cache
          key: shelf-meta-${{ hashFiles('books/**') }}
          restore-keys: shelf-meta-
      - name: Test
        run: npm test
      - name: Build catalog and site
        run: npm run build
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
