# Library settings. Everything here is optional.
title: Satyam’s collection
owner: Satyam
description: Books and essays I keep within reach — open them here, or listen to them in Hear.
# Where the site is published; used for absolute links in opds.xml.
url: https://satyam.lol/shelf/
# Adds a “Listen in Hear” link to every listenable book. Set to "" to turn it off.
hear: https://hear.satyam.lol/

# Display names for shelves (the first folder under books/). Without an entry,
# books/science-fiction/ shows as “Science Fiction”.
shelves:
  philosophy: Philosophy

# Per-book overrides, keyed by id — the book's file name without its extension
# (books/philosophy/meditations.epub → meditations). Every field is optional:
#
#   title, subtitle, author (one name or a list), description, language (en, fr, …),
#   year, publisher, series, series_index
#   tags:    [stoicism, favourites]
#   status:  want | reading | read
#   rating:  1–5
#   note:    a line of your own, shown on the book's page
#   kind:    book | article        (how Hear labels it; PDFs under 48 pages default to article)
#   cover:   covers/my-cover.jpg   (an image in this repo, replacing the detected cover)
#   added:   2026-10-05            (overrides the date of the first commit)
#   listen:  false                 (hide the “Listen in Hear” button)
#   hidden:  true                  (keep the file in the repo but leave it out of the site)
books:
  meditations:
    tags: [stoicism]
  the-art-of-war:
    tags: [strategy]
  self-reliance:
    author: Ralph Waldo Emerson
    year: 1841
    tags: [transcendentalism]
    description: Emerson’s case for trusting your own thought over conformity and the weight of the past — “Whoso would be a man must be a nonconformist.”
