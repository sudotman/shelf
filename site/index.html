<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="{{description}}" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#eee8dc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171511" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <title>{{title}}</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="alternate" type="application/atom+xml;profile=opds-catalog;kind=acquisition" href="./opds.xml" title="{{title}} (OPDS)" />
    <link rel="preload" href="./catalog.json" as="fetch" crossorigin="anonymous" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#library">Skip to the books</a>

    <header class="top">
      <div class="bookplate">
        <p class="bookplate-mark">Ex libris</p>
        <h1 id="owner-name">{{owner}}</h1>
        <p class="bookplate-line" id="shelf-description">{{description}}</p>
      </div>

      <div class="top-tools">
        <form class="search" id="search" role="search">
          <label class="sr-only" for="query">Search the shelves</label>
          <input id="query" type="search" autocomplete="off" spellcheck="false" placeholder="Search the shelves" />
          <kbd aria-hidden="true">/</kbd>
        </form>
        <div class="views" role="group" aria-label="View">
          <button type="button" data-view="shelves" aria-pressed="true">Shelves</button>
          <button type="button" data-view="index" aria-pressed="false">Index</button>
        </div>
      </div>

      <p class="tally" id="tally" aria-live="polite">Taking the books down…</p>
    </header>

    <main id="library" tabindex="-1">
      <div class="bookcase" id="bookcase"></div>
      <div class="index-view" id="index-view" hidden>
        <table class="index">
          <caption class="sr-only">Every book, sortable by column</caption>
          <thead>
            <tr>
              <th scope="col"><button type="button" data-sort="author" aria-pressed="true">Author</button></th>
              <th scope="col"><button type="button" data-sort="title" aria-pressed="false">Title</button></th>
              <th scope="col" class="col-shelf"><button type="button" data-sort="shelf" aria-pressed="false">Shelf</button></th>
              <th scope="col" class="col-length"><button type="button" data-sort="length" aria-pressed="false">Length</button></th>
              <th scope="col" class="col-added"><button type="button" data-sort="added" aria-pressed="false">Added</button></th>
            </tr>
          </thead>
          <tbody id="index-rows"></tbody>
        </table>
      </div>
      <p class="no-match" id="no-match" role="status" hidden></p>
    </main>

    <footer class="colophon">
      <p>
        <a id="hear-link" href="https://hear.satyam.lol/">Listen with Hear</a>
        <span aria-hidden="true">·</span>
        <button type="button" class="link-button" id="copy-opds" data-url="">Copy the OPDS feed</button>
        <span aria-hidden="true">·</span>
        <a href="./catalog.json">catalog.json</a>
        <span aria-hidden="true">·</span>
        <a href="./admin/">Admin</a>
      </p>
      <p id="updated-line"></p>
    </footer>

    <dialog class="slip" id="slip" aria-labelledby="slip-title">
      <button class="slip-close" type="button" id="slip-close" aria-label="Put the book back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
      </button>
      <div class="slip-cover" id="slip-cover"></div>
      <div class="slip-body">
        <h2 id="slip-title" tabindex="-1" autofocus></h2>
        <p class="slip-author" id="slip-author"></p>
        <div class="slip-actions">
          <a class="listen" id="slip-listen" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 6 10 6-10 6V6Z" /></svg>
            <span>Listen in Hear</span>
          </a>
          <a class="quiet-link" id="slip-read" target="_blank" rel="noopener">Read</a>
          <a class="quiet-link" id="slip-download" download>Download</a>
        </div>
        <p class="slip-unlistenable" id="slip-unlistenable" hidden></p>
        <dl class="ledger" id="slip-ledger"></dl>
        <blockquote class="slip-note" id="slip-note" hidden></blockquote>
        <p class="slip-description" id="slip-description"></p>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
